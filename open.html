<!DOCTYPE html>
<html lang="ru">
<head>
    <style>
        .a{
            font-size: 70px;
            background-color: black;
            border-radius: 30px;
            border: solid gray;
            color: white;
            padding: 20px;
            font-weight: bold;
        }
        body{
            height: 800px;
            display: grid;
            justify-content: center;
            align-items: center;
            background-color: red;
            transition: background-color 0.3s ease;
        }
        .f{
            display: flex;
            justify-content: center;
            font-size: 34px;
            background-color: black;
            color: white;
            padding: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 20px;
            transition: 0.6s;
        }
        .f:hover{
            background-color: #333;
        }
    </style>
    <meta charset="UTF-8">
    <title>js training</title>
</head>
<body>
    <div>
        <h1 class="a" id="r">Background Color Change</h1>
        <button class="f" id="colorBtn">CLICK ME</button>
    </div>
    <script>
        // Находим элементы
        const button = document.getElementById('colorBtn');

        // Функция генерации случайного цвета
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // Функция смены цвета
        function changeBackgroundColor() {
            const newColor = getRandomColor();
            document.body.style.backgroundColor = newColor;
        }

        // Назначаем обработчик клика
        button.addEventListener('click', changeBackgroundColor);
    </script>
</body>
</html>
